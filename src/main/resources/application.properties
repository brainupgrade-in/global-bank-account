spring.application.name=account
server.port=8086

#SERVLET PATH
server.error.include-stacktrace=never
server.servlet.context-path=/account

#H2
spring.datasource.url=jdbc:h2:mem:account
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.sql.init.mode=always
#Boot 2.5+ runs data.sql BEFORE Hibernate creates tables; defer it so seed data
#lands after ddl-auto. Without this the app compiles but dies on startup.
spring.jpa.defer-datasource-initialization=true



feign.url-customer-service=${CUSTOMER_SERVICE_URL:localhost:8085/customer}
feign.url-auth-service=${AUTH_SERVICE_URL:localhost:8084/auth}
feign.url-transaction-service=${TRANSACTION_SERVICE_URL:localhost:8087/transaction}

#ACTUATOR - kubernetes liveness/readiness probes
#Served under the context path: /account/actuator/health/{liveness,readiness}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
